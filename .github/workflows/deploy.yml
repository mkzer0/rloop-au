name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Until the custom domain is live the site is served under
      # https://mkzer0.github.io/rloop-au, so root-relative URLs need
      # that prefix. Set the repository variable PAGES_BASE to /rloop-au
      # for the preview stage and delete it once www.recursiveloop.com.au is
      # configured as the custom domain.
      - name: Prefix root-relative URLs for sub-path preview
        if: vars.PAGES_BASE != ''
        env:
          BASE: ${{ vars.PAGES_BASE }}
        run: |
          find dist -type f \( -name '*.html' -o -name '*.css' -o -name '*.xml' \) -print0 \
            | xargs -0 sed -i -E \
                -e "s#((href|src|content)=[\"'])/([^/\"'])#\1${BASE}/\3#g" \
                -e "s#((href|src)=[\"'])/([\"'])#\1${BASE}/\3#g" \
                -e "s#(url=)/([\"'>])#\1${BASE}/\2#g" \
                -e "s#(url\()/#\1${BASE}/#g"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
